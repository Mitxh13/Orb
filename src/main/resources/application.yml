server:
  port: 8080

spring:
  application:
    name: orb
  datasource:
    url: jdbc:postgresql://localhost:5432/orb_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:ThisIsADefaultDevSecretKeyThatIsAtLeast32CharsLong}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT:20}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
